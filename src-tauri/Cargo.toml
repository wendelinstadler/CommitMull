[package]
name = "commitmull"
version = "0.1.0"
description = "Nacktmull-Desktop-Haustier, gefuettert mit GitHub-Commits"
edition = "2021"

[lib]
name = "commitmull_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2.5.0"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native"] }
sha2 = "0.10"
base64 = "0.22"
url = "2"

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_UI_Shell"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "io-util"] }
