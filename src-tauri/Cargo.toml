[package]
name = "commitmull"
version = "0.1.0"
description = "Nacktmull-Desktop-Haustier, gefuettert mit GitHub-Commits"
edition = "2021"

[lib]
name = "commitmull_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
